validation:
  unique_key: "spotify_track_id"
  reject_unmapped_lyrics_files: true
  reject_duplicate_track_ids: true
  require_existing_file_for_success_status: true
  empty_file_is_not_success: true
  never_fill_unknown_features_with_zero: true
  never_create_duplicate_rows_on_rerun: true
  upsert_key: "spotify_track_id"
  log_each_track: true
  log_fields:
    - "spotify_track_id"
    - "title"
    - "language"
    - "lyrics_status"
    - "extraction_status"
    - "lyrics_file"
    - "word_count"
    - "error_reason"
    - "processed_at"
    - "rules_version"

reporting:
  compare_markets_with_language_caveat: true
  report_sample_size_for_each_plot: true
  save_chart_source_data: true
  document_unmeasurable_features: true
  document_tokenization_limitations: true
