  vi:
    # Reviewed Vietnamese pronouns and common lyric address pronouns.
    # Limitation: Kinship terms (anh, em, chị, cô, chú, bác, ông, bà) function as
    # first/second-person pronouns in Vietnamese pop lyrics but can also be nouns.
    - "tôi"
