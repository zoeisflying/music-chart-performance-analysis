pronouns:
  matching:
    case_insensitive: true
    exact_token_match: true
    count_each_occurrence: true
    longest_phrase_wins: true
    ambiguous_forms_policy: "exclude substring matching; only match complete normalized tokens or multi-token phrases"
  en:
    # Reviewed English personal, possessive, reflexive, and interrogative/relative pronouns
    # plus common contraction tokens retained by unicode_word_regex.
